name: search-company

services:
  db:
    image: postgres:17-alpine
    container_name: search-company-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
      POSTGRES_DB: search_company
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d search_company"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
